<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好孩子星級獎勵計劃 🌟 Star Rewards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+HK:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Zen Maru Gothic', 'Noto Sans HK', sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #f0f9ff 50%, #f5f3ff 100%);
            min-height: 100vh;
        }

        .card-pop {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card-pop:hover {
            transform: translateY(-4px) scale(1.02);
        }
        .card-pop:active {
            transform: translateY(2px) scale(0.98);
        }

        .bounce-gentle {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-slate-800 pb-12 antialiased selection:bg-pink-200">

    <div id="app" class="max-w-4xl mx-auto px-4 pt-6">
        <!-- Top Header & Cloud Status Badge -->
        <header class="text-center mb-6">
            <div class="inline-flex items-center gap-2 bg-white/80 backdrop-blur px-4 py-1.5 rounded-full shadow-sm border border-pink-100 mb-2">
                <span class="text-xl">🌈</span>
                <span class="text-sm font-bold bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">家庭專屬 · 好孩子養成記</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-black text-slate-800 tracking-wide flex items-center justify-center gap-2">
                ⭐ 星級獎勵計劃 ⭐
            </h1>
            
            <!-- Cloud Status Indicator & Family Code Pill -->
            <div class="mt-2 flex items-center justify-center gap-2 flex-wrap text-[11px] font-bold">
                <div id="cloud-status-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-100 text-slate-500 border border-slate-200">
                    <span id="sync-icon" class="animate-spin text-xs">⏳</span>
                    <span id="sync-text">連線中...</span>
                </div>
                <button onclick="openFamilyCodeModal()" class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-purple-50 text-purple-600 border border-purple-200 hover:bg-purple-100 transition shadow-sm">
                    <span>🔑 房間碼:</span>
                    <span id="display-family-code" class="font-black">our-happy-family</span>
                    <span class="text-[10px] text-purple-400">✏️</span>
                </button>
            </div>
        </header>

        <!-- Kid Profile Switcher Tabs (Version 1 with Grade Badges) -->
        <div class="grid grid-cols-2 gap-3 mb-6 max-w-md mx-auto">
            <!-- Elder Daughter Tab -->
            <button onclick="switchProfile('elder')" id="tab-elder" class="flex items-center justify-center gap-3 p-3 sm:p-4 rounded-2xl border-2 transition-all card-pop bg-white border-pink-400 shadow-md">
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-pink-100 flex items-center justify-center text-2xl border-2 border-pink-300 shrink-0">
                    👧🏻
                </div>
                <div class="text-left">
                    <div id="name-elder" class="font-black text-slate-800 text-base sm:text-lg">大女兒</div>
                    <div class="text-[11px] font-bold text-pink-500 bg-pink-50 px-2 py-0.5 rounded-full inline-block border border-pink-200">升小一</div>
                </div>
            </button>

            <!-- Younger Daughter Tab -->
            <button onclick="switchProfile('younger')" id="tab-younger" class="flex items-center justify-center gap-3 p-3 sm:p-4 rounded-2xl border-2 transition-all card-pop bg-white/60 border-transparent opacity-70">
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-purple-100 flex items-center justify-center text-2xl border-2 border-purple-300 shrink-0">
                    👧👶
                </div>
                <div class="text-left">
                    <div id="name-younger" class="font-black text-slate-800 text-base sm:text-lg">細女兒</div>
                    <div class="text-[11px] font-bold text-purple-500 bg-purple-50 px-2 py-0.5 rounded-full inline-block border border-purple-200">升K1</div>
                </div>
            </button>
        </div>

        <!-- Score & Status Banner Card -->
        <div id="profile-banner" class="bg-gradient-to-r from-pink-500 via-rose-400 to-amber-400 rounded-3xl p-6 text-white mb-8 shadow-xl relative overflow-hidden transition-all duration-300">
            <div class="absolute -right-8 -bottom-8 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
            <div class="absolute -left-8 -top-8 w-32 h-32 bg-yellow-200/20 rounded-full blur-xl pointer-events-none"></div>

            <div class="flex flex-col sm:flex-row items-center justify-between gap-6 relative z-10">
                <div class="flex items-center gap-4">
                    <div id="avatar-icon" class="w-20 h-20 bg-white/20 backdrop-blur rounded-2xl flex items-center justify-center text-4xl shadow-inner border border-white/30 bounce-gentle">
                        👧🏻
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 id="current-name" class="text-2xl sm:text-3xl font-black">大女兒</h2>
                            <button onclick="openEditNameModal()" class="text-xs bg-white/20 hover:bg-white/30 text-white px-2.5 py-1 rounded-full transition">✏️ 改名</button>
                        </div>
                        <p id="current-tag" class="text-amber-100 font-medium text-sm mt-0.5">升小一 · 努力儲星中！</p>
                    </div>
                </div>

                <!-- Point Counter -->
                <div class="bg-white/20 backdrop-blur px-6 py-3 rounded-2xl border border-white/40 text-center min-w-[160px] shadow-lg">
                    <div class="text-xs text-amber-100 font-bold uppercase tracking-wider">目前星星分數</div>
                    <div class="flex items-center justify-center gap-2 mt-1">
                        <span class="text-3xl text-yellow-300 drop-shadow">⭐</span>
                        <span id="point-count" class="text-4xl font-black tracking-tight text-white drop-shadow-md">0</span>
                        <span class="text-lg font-bold text-amber-100">分</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section Navigation Tabs -->
        <div class="flex justify-center border-b border-slate-200 mb-6 gap-2 sm:gap-6 text-sm font-bold">
            <button onclick="switchSection('tasks')" id="sec-tab-tasks" class="pb-3 border-b-4 border-pink-500 text-pink-600 flex items-center gap-1.5 px-3 transition">
                <span>📋</span> 每日任務庫
            </button>
            <button onclick="switchSection('rewards')" id="sec-tab-rewards" class="pb-3 border-b-4 border-transparent text-slate-400 hover:text-slate-600 flex items-center gap-1.5 px-3 transition">
                <span>🎁</span> 夢想兌換站
            </button>
            <button onclick="switchSection('history')" id="sec-tab-history" class="pb-3 border-b-4 border-transparent text-slate-400 hover:text-slate-600 flex items-center gap-1.5 px-3 transition">
                <span>📜</span> 星星紀錄簿
            </button>
        </div>

        <!-- SECTION 1: TASKS -->
        <div id="section-tasks" class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <div>
                    <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                        <span>🎯</span> 完成任務賺星星
                    </h3>
                    <p class="text-xs text-slate-500">點擊右側「完成」按鈕，即可自動獲取分數獎勵！</p>
                </div>
                <button onclick="openAddTaskModal()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold text-sm px-4 py-2.5 rounded-xl transition shadow-md hover:shadow-pink-200 flex items-center justify-center gap-2">
                    <span>➕</span> 新增自訂任務
                </button>
            </div>

            <!-- Task Category Filter Buttons -->
            <div class="flex flex-wrap gap-2 text-xs font-bold">
                <button onclick="filterTasks('all')" class="task-filter-btn px-3 py-1.5 rounded-xl bg-slate-800 text-white shadow-sm" data-cat="all">全部任務</button>
                <button onclick="filterTasks('routine')" class="task-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100" data-cat="routine">🌅 好習慣與作息</button>
                <button onclick="filterTasks('housework')" class="task-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100" data-cat="housework">🧹 家務小幫手</button>
                <button onclick="filterTasks('learning')" class="task-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100" data-cat="learning">📚 自主學習</button>
                <button onclick="filterTasks('manners')" class="task-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100" data-cat="manners">💖 禮貌與自理</button>
            </div>

            <!-- Task Cards Grid -->
            <div id="tasks-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <!-- SECTION 2: REWARDS -->
        <div id="section-rewards" class="space-y-6 hidden">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <div>
                    <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                        <span>🛍️</span> 星星商店
                    </h3>
                    <p class="text-xs text-slate-500">累積足夠星星，即可向爸爸媽媽兌換心儀獎勵！</p>
                </div>
                <button onclick="openAddRewardModal()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold text-sm px-4 py-2.5 rounded-xl transition shadow-md hover:shadow-purple-200 flex items-center justify-center gap-2">
                    <span>➕</span> 新增自訂獎勵
                </button>
            </div>

            <!-- Reward Category Filter -->
            <div class="flex flex-wrap gap-2 text-xs font-bold">
                <button onclick="filterRewards('all')" class="reward-filter-btn px-3 py-1.5 rounded-xl bg-slate-800 text-white shadow-sm" data-rcat="all">全部獎勵</button>
                <button onclick="filterRewards('treat')" class="reward-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100" data-rcat="treat">🍣 美味餐點/美食</button>
                <button onclick="filterRewards('outing')" class="reward-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100" data-rcat="outing">🛝 放電與外遊</button>
                <button onclick="filterRewards('activity')" class="reward-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100" data-rcat="activity">🎨 健康特權與趣味</button>
            </div>

            <!-- Reward Cards Grid -->
            <div id="rewards-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <!-- SECTION 3: HISTORY LOG -->
        <div id="section-history" class="space-y-4 hidden">
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                        <span>📜</span> 得分與兌換紀錄
                    </h3>
                    <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-red-500 transition">清空紀錄</button>
                </div>
                <div id="history-list" class="space-y-3 max-h-96 overflow-y-auto pr-2 custom-scrollbar"></div>
            </div>
        </div>
    </div>

    <!-- Modal Backdrop -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        
        <!-- Modal 1: Add Custom Task -->
        <div id="modal-add-task" class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl hidden">
            <h3 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span>✨</span> 新增任務
            </h3>
            <div class="space-y-4 text-sm">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">任務名稱</label>
                    <input type="text" id="input-task-title" placeholder="例如：主動擺好碗筷" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">選擇 Emoji 圖示</label>
                    <input type="text" id="input-task-emoji" placeholder="例如：🥣 (也可留空)" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">獎勵分數</label>
                        <input type="number" id="input-task-points" value="1" min="1" max="10" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">任務類別</label>
                        <select id="input-task-cat" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-400 bg-white">
                            <option value="routine">🌅 好習慣</option>
                            <option value="housework">🧹 家務幫手</option>
                            <option value="learning">📚 自主學習</option>
                            <option value="manners">💖 禮貌自理</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">對象</label>
                    <select id="input-task-target" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-400 bg-white">
                        <option value="both">👧🏻👧👶 兩位女兒通用</option>
                        <option value="elder">👧🏻 大女兒專屬 (升小一)</option>
                        <option value="younger">👧👶 細女兒專屬 (升K1)</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 font-bold text-slate-600 hover:bg-slate-200">取消</button>
                <button onclick="saveCustomTask()" class="flex-1 py-2.5 rounded-xl bg-pink-500 font-bold text-white hover:bg-pink-600 shadow-md">確認新增</button>
            </div>
        </div>

        <!-- Modal 2: Add Custom Reward -->
        <div id="modal-add-reward" class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl hidden">
            <h3 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span>🎁</span> 新增獎勵
            </h3>
            <div class="space-y-4 text-sm">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">獎勵名稱</label>
                    <input type="text" id="input-reward-title" placeholder="例如：去海洋公園玩一天" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-400">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">選擇 Emoji 圖示</label>
                    <input type="text" id="input-reward-emoji" placeholder="例如：🐬" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-400">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">所需星星分數</label>
                        <input type="number" id="input-reward-points" value="10" min="1" max="100" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-400">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">獎勵類別</label>
                        <select id="input-reward-cat" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white">
                            <option value="treat">🍣 美味餐點</option>
                            <option value="outing">🛝 外遊放電</option>
                            <option value="activity">🎨 健康特權</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 font-bold text-slate-600 hover:bg-slate-200">取消</button>
                <button onclick="saveCustomReward()" class="flex-1 py-2.5 rounded-xl bg-purple-500 font-bold text-white hover:bg-purple-600 shadow-md">確認新增</button>
            </div>
        </div>

        <!-- Modal 3: Change Name Modal -->
        <div id="modal-edit-name" class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl hidden">
            <h3 class="text-xl font-bold text-slate-800 mb-3 flex items-center gap-2">✏️ 修改女兒暱稱</h3>
            <p class="text-xs text-slate-500 mb-4">輸入你給女兒的親切稱呼（例如：心心、柔柔）</p>
            <input type="text" id="input-kid-name" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm font-bold mb-4">
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 font-bold text-slate-600">取消</button>
                <button onclick="saveNameChange()" class="flex-1 py-2.5 rounded-xl bg-amber-500 font-bold text-white shadow-md">儲存</button>
            </div>
        </div>

        <!-- Modal 4: Alert Notification Modal -->
        <div id="modal-alert" class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl hidden text-center">
            <div id="alert-icon" class="text-5xl mb-3">🎉</div>
            <h3 id="alert-title" class="text-xl font-bold text-slate-800 mb-2">成功兌換！</h3>
            <p id="alert-msg" class="text-sm text-slate-600 mb-6">恭喜你得到了這項獎勵！</p>
            <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-slate-800 font-bold text-white shadow-md hover:bg-slate-700">我知道了！</button>
        </div>

        <!-- Modal 5: Family Sync Code Modal -->
        <div id="modal-family-code" class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl hidden">
            <h3 class="text-xl font-bold text-slate-800 mb-2 flex items-center gap-2">🔑 設定家庭專屬房間碼</h3>
            <p class="text-xs text-slate-500 mb-4">你與太太的手機只要輸入**相同的房間碼**，兩部手機的分數和紀錄就會即時同步！</p>
            <input type="text" id="input-family-code" placeholder="例如：chan-family-888" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-400 text-sm font-bold mb-4">
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 font-bold text-slate-600">取消</button>
                <button onclick="saveFamilyCode()" class="flex-1 py-2.5 rounded-xl bg-purple-600 font-bold text-white shadow-md hover:bg-purple-700">儲存並同步</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 1. Default Datasets
        const DEFAULT_TASKS = [
            { id: 't1', title: '晚上 9:30 前準時上床洗澡睡覺', emoji: '🌙', points: 1, cat: 'routine', target: 'both' },
            { id: 't2', title: '早上 7:30 前自動自覺起床', emoji: '☀️', points: 1, cat: 'routine', target: 'both' },
            { id: 't3', title: '玩完玩具後主動歸位整理乾淨', emoji: '🧸', points: 1, cat: 'routine', target: 'both' },
            { id: 't4', title: '獨立收拾好自己的小書包與上學用品', emoji: '🎒', points: 1, cat: 'routine', target: 'elder' },
            { id: 't5', title: '出門前自己穿好鞋子與外套', emoji: '👟', points: 1, cat: 'routine', target: 'younger' },
            { id: 't6', title: '吃飯前幫忙擺放碗筷與紙巾', emoji: '🥣', points: 1, cat: 'housework', target: 'both' },
            { id: 't7', title: '吃完飯後把自己的碗盤放到洗碗槽', emoji: '🍽️', points: 1, cat: 'housework', target: 'both' },
            { id: 't8', title: '幫忙抹桌子或整理餐桌', emoji: '🧹', points: 1, cat: 'housework', target: 'both' },

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (type === 'point') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
                        gain.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.08);
                        osc.stop(ctx.currentTime + idx * 0.08 + 0.3);
                    });
                } else if (type === 'redeem') {
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.4);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.12);
                        osc.stop(ctx.currentTime + idx * 0.12 + 0.4);
                    });
                }
            } catch (e) {
                console.log('Audio contextual note unsupported');
            }
        }

        function redeemReward(rewardId) {
            const reward = state.rewards.find(r => r.id === rewardId);
            if (!reward) return;

            const prof = state.profiles[state.activeProfile];
            if (prof.points < reward.points) return;

            prof.points -= reward.points;

            const now = new Date();
            const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            prof.history.push({
                type: 'spend',
                title: reward.title,
                points: reward.points,
                date: dateStr
            });

            playSound('redeem');
            confetti({ particleCount: 90, spread: 100, origin: { y: 0.6 } });

            renderAll();

            cloudDocRef = doc(db, 'artifacts', 'kids-star-rewards', 'public', 'data', 'families', familyCode);

            unsubscribeCloud = onSnapshot(cloudDocRef, (snap) => {
                if (snap.exists()) {

                        state = { ...state, ...cloudState };
                        renderAll();

            }, (err) => {

                let config = DEFAULT_FIREBASE_CONFIG;
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    try { config = JSON.parse(__firebase_config); } catch(e){}
                }

                const app = initializeApp(config);
                const auth = getAuth(app);
                
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                db = getFirestore(app);
                isCloudActive = true;

                subscribeToCloudDoc();

                badgeText.innerText = "☁️ 雲端實時同步中";
                badgeIcon.innerText = "🟢";
                badgeIcon.classList.remove('animate-spin');
                badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200";

            } catch (err) {
                console.log("Operating in LocalStorage Mode:", err.message);
                badgeText.innerText = "📱 本機儲存模式";
                badgeIcon.innerText = "💾";
                badgeIcon.classList.remove('animate-spin');
                badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 text-blue-600 border border-blue-200";
            }
        }

        window.onload = function() {
            initCloudSync();
        };
    </script>
</body>
</html>

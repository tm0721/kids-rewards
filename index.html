            familyCode: 'our-happy-family',
            activeProfile: 'elder',
            updatedAt: Date.now(),
            profiles: {
                elder: { name: '大女兒', tag: '努力儲星中！', subTag: '升小一', points: 0, avatar: '👧🏻', history: [] },
                younger: { name: '細女兒', tag: '快樂成長中！', subTag: '升K1', points: 0, avatar: '👧👶', history: [] }

        let mqttClient = null;

        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('kids_rewards_v3_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.profiles) {
                        state = { ...state, ...parsed };
                    }
                }
            } catch(e) {
                console.error("Local load error", e);
            }

            // Check URL for room parameter (?room=xxx)
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                state.familyCode = roomParam.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
            }
        }

        function saveState(broadcast = true) {
            state.updatedAt = Date.now();
            try {
                localStorage.setItem('kids_rewards_v3_state', JSON.stringify(state));
            } catch(e) {}

            if (broadcast && mqttClient && mqttClient.connected) {
                const topic = `kids_star_rewards_v3/${state.familyCode}`;
                mqttClient.publish(topic, JSON.stringify(state), { qos: 1, retain: true });
            }
        }

        function copyShareLink() {
            const url = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(state.familyCode)}`;
            const tempInput = document.createElement('input');
            tempInput.value = url;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showAlert('🔗 專屬連結已複製！', `已複製房間【${state.familyCode}】的專屬網址！\n\n你可以直接透過 WhatsApp 發給太太，太太一開啟連結就會自動進入相同的房間同步！`, '📲');
        }

            state.activeProfile = profileKey;

            const tabYounger = document.getElementById('tab-younger');

                tabYounger.className = "flex items-center justify-center gap-3 p-3 sm:p-4 rounded-2xl border-2 transition-all card-pop bg-white/60 border-transparent opacity-70";
            } else {
                tabElder.className = "flex items-center justify-center gap-3 p-3 sm:p-4 rounded-2xl border-2 transition-all card-pop bg-white/60 border-transparent opacity-70";
                tabYounger.className = "flex items-center justify-center gap-3 p-3 sm:p-4 rounded-2xl border-2 transition-all card-pop bg-white border-purple-400 shadow-md";
            }

            renderAll();
            saveState(true);
        }

            document.getElementById('current-tag').innerText = p.tag;
            document.getElementById('point-count').innerText = p.points;
            document.getElementById('avatar-icon').innerText = p.avatar;

            document.getElementById('name-younger').innerText = state.profiles.younger.name;

            } else {

            }

        function renderTasks() {
            const container = document.getElementById('tasks-grid');
            container.innerHTML = '';

            const currentProf = state.activeProfile;
            const filtered = state.tasks.filter(t => {
                const matchCat = state.taskFilter === 'all' || t.cat === state.taskFilter;
                const matchTarget = t.target === 'both' || t.target === currentProf;
                return matchCat && matchTarget;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
                        <div class="text-4xl mb-2">🎈</div>
                        <p class="font-bold">暫時沒有此類別任務，點擊上方按鈕新增吧！</p>
                    </div>

                return;
            }

            filtered.forEach(task => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-4 border border-slate-100 shadow-sm hover:shadow-md transition-all flex items-center justify-between gap-3 card-pop";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-2xl bg-amber-50 flex items-center justify-center text-2xl border border-amber-100 shrink-0">

                                    +${task.points} ⭐
                                </span>
                                ${task.target !== 'both' ? `<span class="text-[10px] text-pink-500 bg-pink-50 border border-pink-200 px-1.5 py-0.5 rounded font-bold">${task.target === 'elder' ? '升小一專屬' : '升K1專屬'}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <button onclick="addPoints('${task.id}')" class="shrink-0 bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-500 hover:to-orange-500 text-white font-black text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-md transition-all active:scale-95 flex items-center gap-1">
                        <span>完成</span>
                        <span>✨</span>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function renderRewards() {
            const container = document.getElementById('rewards-grid');
            container.innerHTML = '';

            const currentPoints = state.profiles[state.activeProfile].points;
            const filtered = state.rewards.filter(r => state.rewardFilter === 'all' || r.cat === state.rewardFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
                        <div class="text-4xl mb-2">🎁</div>
                        <p class="font-bold">暫時沒有此類別獎勵</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(reward => {
                const canAfford = currentPoints >= reward.points;
                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl p-4 border transition-all flex items-center justify-between gap-3 ${canAfford ? 'border-purple-200 shadow-sm card-pop' : 'border-slate-100 opacity-60'}`;
                
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 ${canAfford ? 'bg-purple-50 border-purple-100' : 'bg-slate-100 border-slate-200'} rounded-2xl flex items-center justify-center text-2xl border shrink-0">
                            ${reward.emoji || '🎁'}

                        <div>
                            <h4 class="font-bold text-slate-800 text-sm sm:text-base leading-snug">${reward.title}</h4>

                                <span class="text-xs font-black text-purple-600 bg-purple-50 px-2 py-0.5 rounded-md border border-purple-200/60">

                            </div>

            });
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            container.innerHTML = '';

            const history = state.profiles[state.activeProfile].history;
            if (!history || history.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-400">
                        <div class="text-3xl mb-1">📝</div>
                        <p class="text-xs font-bold">還沒有任何星星紀錄，快去完成任務吧！</p>
                    </div>
                `;
                return;
            }

            [...history].reverse().forEach(item => {
                const isEarn = item.type === 'earn';
                const el = document.createElement('div');
                el.className = "flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100 text-xs sm:text-sm";
                el.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span>${isEarn ? '✨' : '🎁'}</span>
                        <span class="font-bold text-slate-700">${item.title}</span>
                        <span class="text-[10px] text-slate-400">${item.date}</span>
                    </div>
                    <span class="font-black ${isEarn ? 'text-emerald-500' : 'text-rose-500'}">
                        ${isEarn ? '+' : '-'}${item.points} ⭐
                    </span>
                `;
                container.appendChild(el);
            });
        }

        function renderAll() {
            renderBanner();
            renderTasks();
            renderRewards();
            renderHistory();
        }

        function addPoints(taskId) {
            const task = state.tasks.find(t => t.id === taskId);
            if (!task) return;

            const prof = state.profiles[state.activeProfile];
            prof.points += task.points;

            const now = new Date();
            const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            prof.history.push({
                type: 'earn',
                title: task.title,
                points: task.points,
                date: dateStr
            });

            playSound('point');
            confetti({ particleCount: 35, spread: 70, origin: { y: 0.8 } });

            renderAll();
            saveState(true);
        }

        function redeemReward(rewardId) {
            const reward = state.rewards.find(r => r.id === rewardId);
            if (!reward) return;

            const prof = state.profiles[state.activeProfile];
            if (prof.points < reward.points) return;

            prof.points -= reward.points;

            const now = new Date();
            const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            prof.history.push({
                type: 'spend',
                title: reward.title,
                points: reward.points,
                date: dateStr
            });

            playSound('redeem');
            confetti({ particleCount: 90, spread: 100, origin: { y: 0.6 } });

            renderAll();
            saveState(true);

            showAlert('🎉 兌換成功！', `恭喜 ${prof.name} 順利兌換到【${reward.title}】！記得找爸爸媽媽履行約定喔！`, '🎁');
        }

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (type === 'point') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
                        gain.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.08);
                        osc.stop(ctx.currentTime + idx * 0.08 + 0.3);
                    });
                } else if (type === 'redeem') {
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.4);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.12);
                        osc.stop(ctx.currentTime + idx * 0.12 + 0.4);
                    });
                }
            } catch (e) {}
        }

        function switchSection(sec) {
            document.getElementById('section-tasks').classList.add('hidden');
            document.getElementById('section-rewards').classList.add('hidden');

        }

        }

        function saveFamilyCode() {
            const newCode = document.getElementById('input-family-code').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
            if (!newCode) return;

            if (mqttClient && mqttClient.connected) {
                mqttClient.unsubscribe(`kids_star_rewards_v3/${state.familyCode}`);
            }

            state.familyCode = newCode;
            document.getElementById('display-family-code').innerText = newCode;
            closeModal();

            if (mqttClient && mqttClient.connected) {
                mqttClient.subscribe(`kids_star_rewards_v3/${state.familyCode}`, { qos: 1 });
            }

            saveState(true);
        }

        function saveCustomTask() {
            const title = document.getElementById('input-task-title').value.trim();
            const emoji = document.getElementById('input-task-emoji').value.trim() || '⭐';
            const points = parseInt(document.getElementById('input-task-points').value) || 1;
            const cat = document.getElementById('input-task-cat').value;
            const target = document.getElementById('input-task-target').value;

            if (!title) return;

            state.tasks.push({ id: 'custom_' + Date.now(), title, emoji, points, cat, target });

            closeModal();
            renderTasks();
            saveState(true);

            document.getElementById('input-task-title').value = '';
            document.getElementById('input-task-emoji').value = '';
        }

        function saveCustomReward() {
            const title = document.getElementById('input-reward-title').value.trim();
            const emoji = document.getElementById('input-reward-emoji').value.trim() || '🎁';
            const points = parseInt(document.getElementById('input-reward-points').value) || 10;
            const cat = document.getElementById('input-reward-cat').value;

            if (!title) return;

            state.rewards.push({ id: 'custom_r_' + Date.now(), title, emoji, points, cat });

            closeModal();
            renderRewards();
            saveState(true);

            document.getElementById('input-reward-title').value = '';
            document.getElementById('input-reward-emoji').value = '';
        }

        function saveNameChange() {
            const newName = document.getElementById('input-kid-name').value.trim();
            if (!newName) return;

            state.profiles[state.activeProfile].name = newName;

            closeModal();
            renderBanner();
            saveState(true);
        }

        function clearHistory() {
            state.profiles[state.activeProfile].history = [];
            renderHistory();
            saveState(true);
        }

        function initMQTTCloudSync() {
            loadFromLocalStorage();
            renderAll();

            const badgeText = document.getElementById('sync-text');
            const badgeIcon = document.getElementById('sync-icon');
            const badge = document.getElementById('cloud-status-badge');

            document.getElementById('display-family-code').innerText = state.familyCode;

            // Connect to public MQTT WebSocket broker
            const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
            const clientId = 'kids_client_' + Math.random().toString(16).substring(2, 10);

            try {
                mqttClient = mqtt.connect(brokerUrl, {
                    clientId: clientId,
                    clean: true,
                    connectTimeout: 5000,
                    reconnectPeriod: 3000
                });

                mqttClient.on('connect', () => {
                    badgeText.innerText = "☁️ 雲端實時同步中";
                    badgeIcon.innerText = "🟢";
                    badgeIcon.classList.remove('animate-spin');
                    badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200";

                    const topic = `kids_star_rewards_v3/${state.familyCode}`;
                    mqttClient.subscribe(topic, { qos: 1 });

                    // Broadcast current state to update retain buffer
                    saveState(true);
                });

                mqttClient.on('message', (topic, message) => {
                    try {
                        const incomingState = JSON.parse(message.toString());
                        if (incomingState && incomingState.profiles) {
                            // Only update if incoming state is newer
                            if (!state.updatedAt || incomingState.updatedAt > state.updatedAt) {
                                state = { ...state, ...incomingState };
                                try { localStorage.setItem('kids_rewards_v3_state', JSON.stringify(state)); } catch(e){}
                                renderAll();
                            }
                        }
                    } catch(err) {
                        console.warn("Sync parse error", err);
                    }
                });

                mqttClient.on('error', () => {
                    badgeText.innerText = "📱 本機模式 (網絡異常)";
                    badgeIcon.innerText = "🟡";
                    badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-50 text-amber-600 border border-amber-200";
                });

                mqttClient.on('offline', () => {
                    badgeText.innerText = "📱 本機模式 (離線)";
                    badgeIcon.innerText = "💾";
                    badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-100 text-slate-500 border border-slate-200";
                });

            } catch(e) {
                badgeText.innerText = "📱 本機儲存模式";
                badgeIcon.innerText = "💾";
            }
        }

        // Global exports
        window.switchProfile = switchProfile;
        window.addPoints = addPoints;
        window.redeemReward = redeemReward;
        window.switchSection = switchSection;
        window.filterTasks = filterTasks;
        window.filterRewards = filterRewards;
        window.openAddTaskModal = openAddTaskModal;
        window.openAddRewardModal = openAddRewardModal;
        window.openEditNameModal = openEditNameModal;
        window.openFamilyCodeModal = openFamilyCodeModal;
        window.closeModal = closeModal;
        window.saveCustomTask = saveCustomTask;
        window.saveCustomReward = saveCustomReward;
        window.saveNameChange = saveNameChange;
        window.saveFamilyCode = saveFamilyCode;
        window.clearHistory = clearHistory;
        window.copyShareLink = copyShareLink;

        window.onload = function() {
            initMQTTCloudSync();
        };
    </script>
</body>
</html>

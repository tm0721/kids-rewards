<style>
    body {
        font-family: 'Zen Maru Gothic', 'Noto Sans HK', sans-serif;
        background: linear-gradient(135deg, #f0fdf4 0%, #f0f9ff 50%, #fdf2f8 100%);
        min-height: 100vh;
    }
    .card-pop {
        transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-pop:active {
        transform: scale(0.96);
    }
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.03);
    }
    ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 10px;
    }

<div class="max-w-md md:max-w-2xl mx-auto px-4 pt-6">

            <span>🌟</span> 好孩子星級獎勵計劃 <span>✨</span>

        <p class="text-xs text-slate-500 mt-1 font-bold">建立良好習慣 ‧ 努力累積星星換大獎</p>

        <!-- Sync Pill & Setup Button -->
        <div class="mt-3 flex items-center justify-center gap-2 flex-wrap text-xs font-bold">
            <div id="cloud-status-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-100 text-slate-500 border border-slate-200">
                <span id="sync-icon">💾</span>
                <span id="sync-text">本機紀錄模式</span>
            </div>
            <button onclick="openGithubModal()" class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-slate-800 text-white hover:bg-slate-700 transition shadow-sm active:scale-95">
                <span>🐙 GitHub JSON 同步設定</span>
            </button>
            <button onclick="manualSyncFromCloud()" class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-pink-500 text-white hover:bg-pink-600 transition shadow-sm font-bold active:scale-95">
                <span>🔄 立即刷新同步</span>
            </button>
        </div>
    </header>

    <!-- Kid Profile Switcher Tabs -->
    <div class="grid grid-cols-2 gap-3 mb-6">
        <button id="tab-elder" onclick="switchProfile('elder')" class="flex items-center justify-center gap-3 p-3 sm:p-4 rounded-2xl border-2 transition-all card-pop bg-white border-pink-400 shadow-md">
            <span class="text-3xl">👧🏻</span>
            <div class="text-left">
                <div id="name-elder" class="font-black text-slate-800 text-base sm:text-lg">大女兒</div>
                <span class="text-[10px] bg-pink-100 text-pink-600 px-2 py-0.5 rounded-full font-bold">升小一</span>
            </div>
        </button>
        
        <button id="tab-younger" onclick="switchProfile('younger')" class="flex items-center justify-center gap-3 p-3 sm:p-4 rounded-2xl border-2 transition-all card-pop bg-white/60 border-transparent opacity-70">
            <span class="text-3xl">👧👶</span>
            <div class="text-left">
                <div id="name-younger" class="font-black text-slate-800 text-base sm:text-lg">細女兒</div>
                <span class="text-[10px] bg-purple-100 text-purple-600 px-2 py-0.5 rounded-full font-bold">升K1</span>
            </div>
        </button>
    </div>

    <!-- Hero Star Score Card -->
    <div id="profile-banner" class="bg-gradient-to-r from-pink-500 via-rose-400 to-amber-400 rounded-3xl p-6 text-white mb-6 shadow-xl relative overflow-hidden transition-all duration-300">

        <div class="flex items-center justify-between relative z-10">
            <div class="flex items-center gap-3">

                        <button onclick="openEditNameModal()" class="text-xs bg-white/20 hover:bg-white/30 px-2 py-0.5 rounded-lg text-white font-bold transition">✏️ 改名</button>
                    </div>

                </div>
            </div>
            <div class="text-right">

                <div class="text-4xl sm:text-5xl font-black drop-shadow-md flex items-center justify-end gap-1">
                    <span id="point-count">0</span>
                    <span class="text-amber-300 text-3xl sm:text-4xl">⭐</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation Section Switcher -->
    <div class="flex border-b-2 border-slate-200/80 mb-6 text-sm font-black">

            <span>好行為任務</span>

            <span>🎁</span>
            <span>獎勵換領</span>
        </button>
        <button id="sec-tab-history" onclick="switchSection('history')" class="pb-3 border-b-4 border-transparent text-slate-400 hover:text-slate-600 flex items-center gap-1.5 px-3 transition">
            <span>📜</span>
            <span>星星紀錄</span>
        </button>
    </div>

    <!-- TASKS SECTION -->
    <div id="section-tasks" class="space-y-4">
        <div class="flex items-center justify-between gap-2 overflow-x-auto pb-1 text-xs font-bold">
            <div class="flex items-center gap-1 shrink-0">
                <button onclick="filterTasks('all')" data-cat="all" class="task-filter-btn px-3 py-1.5 rounded-xl bg-slate-800 text-white shadow-sm">全部</button>
                <button onclick="filterTasks('routine')" data-cat="routine" class="task-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100">☀️ 常規/自理</button>
                <button onclick="filterTasks('housework')" data-cat="housework" class="task-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100">🧹 家務小幫手</button>
                <button onclick="filterTasks('learning')" data-cat="learning" class="task-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100">✏️ 學習閱讀</button>
                <button onclick="filterTasks('manners')" data-cat="manners" class="task-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100">💖 禮貌情緒</button>

                <span>➕</span>
                <span>新增任務</span>
            </button>
        </div>

        <div id="tasks-grid" class="grid grid-cols-1 gap-3"></div>
    </div>

    <!-- REWARDS SECTION -->
    <div id="section-rewards" class="space-y-4 hidden">
        <div class="flex items-center justify-between gap-2 overflow-x-auto pb-1 text-xs font-bold">
            <div class="flex items-center gap-1 shrink-0">
                <button onclick="filterRewards('all')" data-rcat="all" class="reward-filter-btn px-3 py-1.5 rounded-xl bg-slate-800 text-white shadow-sm">全部</button>
                <button onclick="filterRewards('treat')" data-rcat="treat" class="reward-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100">🍣 美味美食</button>
                <button onclick="filterRewards('outing')" data-rcat="outing" class="reward-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100">🛝 戶外放電</button>
                <button onclick="filterRewards('activity')" data-rcat="activity" class="reward-filter-btn px-3 py-1.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100">🎨 家庭時光</button>

                <span>新增獎勵</span>
            </button>
        </div>

        <div id="rewards-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </div>

    <!-- HISTORY SECTION -->
    <div id="section-history" class="space-y-4 hidden">
        <div class="flex items-center justify-between">
            <h3 class="font-black text-sm text-slate-700 flex items-center gap-1">
                <span>📜</span> 最近獎勵與兌換紀錄

    </div>

</div>

<!-- MODALS -->
<div id="modal-backdrop" onclick="closeModal()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden transition-opacity"></div>

<!-- GitHub Sync Modal -->
<div id="modal-github-sync" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[92%] max-w-md bg-white rounded-3xl p-6 shadow-2xl z-50 hidden border border-slate-100">
    <h3 class="text-lg font-black text-slate-800 mb-2 flex items-center gap-2">
        <span>🐙</span> GitHub JSON 同步設定
    </h3>
    <p class="text-xs text-slate-500 mb-4 font-bold leading-relaxed">
        透過 GitHub Gist 儲存 JSON，你和太太的手機可以實時共享資料，不會丟失！
    </p>

    <div class="space-y-3 text-xs font-bold">
        <div>
            <label class="block text-slate-600 mb-1">1. GitHub Personal Access Token (PAT)</label>
            <input type="password" id="github-token-input" placeholder="ghp_xxxxxxxxxxxx" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-slate-800">
            <p class="text-[10px] text-slate-400 mt-1">請在 GitHub -> Settings -> Developer settings -> Personal Access Tokens (Classic) 申請，需勾選 <b>gist</b> 權限。</p>
        </div>

        <div>
            <label class="block text-slate-600 mb-1">2. GitHub Gist ID</label>
            <input type="text" id="github-gist-id-input" placeholder="例如：a1b2c3d4e5f6..." class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-slate-800">
        </div>

        <button onclick="autoCreateGist()" class="w-full py-2 bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 rounded-xl transition text-xs font-black">
            ✨ 填了 Token 後，按此自動建立 Gist ID
        </button>
    </div>

    <div class="flex gap-2 mt-6 font-bold text-xs">
        <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600">取消</button>
        <button onclick="saveGithubSettings()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-white shadow-md">儲存並同步</button>
    </div>
</div>

<!-- Add Task Modal -->

    function loadFromLocalStorage() {

                if (parsed && parsed.profiles) {
                    state = { ...state, ...parsed };
                }
            }
        } catch(e) {}

        // Support direct URL query parameter settings (?token=xxx&gist=yyy)
        const params = new URLSearchParams(window.location.search);
        if (params.get('token')) state.github.token = params.get('token');
        if (params.get('gist')) state.github.gistId = params.get('gist');

    // --- GITHUB GIST SYNC CORE ---
    async function syncToGitHub() {
        saveToLocalStorage();

        if (!state.github.token || !state.github.gistId) {
            updateSyncBadge('local', '本機紀錄模式');
            return;
        }

        updateSyncBadge('syncing', '上載至 GitHub...');

        try {
            const cleanState = { ...state };
            // Keep token inside JSON body light
            cleanState.updatedAt = Date.now();

            const response = await fetch(`https://api.github.com/gists/${state.github.gistId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `token ${state.github.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    description: '好孩子星級獎勵計劃資料庫',
                    files: {
                        'kids_star_rewards.json': {
                            content: JSON.stringify(cleanState, null, 2)
                        }
                    }
                })
            });

            if (response.ok) {
                updateSyncBadge('success', '已同步至 GitHub');
            } else {
                updateSyncBadge('error', 'GitHub 同步失敗 (檢查Token/ID)');
            }
        } catch(e) {
            updateSyncBadge('error', '網路連接失敗');
        }
    }

    async function fetchFromGitHub() {
        if (!state.github.token || !state.github.gistId) return;

        updateSyncBadge('syncing', '載入 GitHub 資料...');

        try {
            const response = await fetch(`https://api.github.com/gists/${state.github.gistId}`, {
                headers: {
                    'Authorization': `token ${state.github.token}`
                }
            });

            if (response.ok) {
                const gistData = await response.json();
                const jsonContent = gistData.files['kids_star_rewards.json']?.content;

                if (jsonContent) {
                    const cloudState = JSON.parse(jsonContent);
                    if (!state.updatedAt || cloudState.updatedAt >= state.updatedAt) {
                        state = { ...state, ...cloudState };
                        saveToLocalStorage();
                        renderAll();
                        updateSyncBadge('success', '已同步 GitHub 最新數據');
                    }
                }
            } else {
                updateSyncBadge('error', '無法取得 GitHub 資料');
            }
        } catch(e) {
            updateSyncBadge('error', 'GitHub 網路超時');
        }
    }

                },
                body: JSON.stringify({

    function addPoints(taskId) {
        const task = state.tasks.find(t => t.id === taskId);
        if (!task) return;

        const prof = state.profiles[state.activeProfile];
        prof.points += task.points;

        const now = new Date();
        const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        prof.history.push({
            type: 'earn',
            title: task.title,
            points: task.points,
            date: dateStr
        });

        playSound('point');
        confetti({ particleCount: 35, spread: 70, origin: { y: 0.8 } });

        renderAll();
        syncToGitHub();
    }

    function redeemReward(rewardId) {
        const reward = state.rewards.find(r => r.id === rewardId);
        if (!reward) return;

        const prof = state.profiles[state.activeProfile];
        if (prof.points < reward.points) return;

        prof.points -= reward.points;

        const now = new Date();
        const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        prof.history.push({
            type: 'spend',
            title: reward.title,
            points: reward.points,
            date: dateStr
        });

        playSound('redeem');
        confetti({ particleCount: 90, spread: 100, origin: { y: 0.6 } });

        renderAll();
        syncToGitHub();

        showAlert('🎉 兌換成功！', `恭喜 ${prof.name} 順利兌換到【${reward.title}】！記得找爸爸媽媽履行約定喔！`, '🎁');
    }

    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (type === 'point') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.08);
                    osc.stop(ctx.currentTime + idx * 0.08 + 0.3);
                });
            } else if (type === 'redeem') {
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.12);
                    osc.stop(ctx.currentTime + idx * 0.12 + 0.4);
                });
            }
        } catch (e) {}
    }

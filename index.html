                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.profiles) {
                        state = { ...state, ...parsed };
                    }
                }
            } catch(e) {
                console.error("Local storage error:", e);
            }

            // Read Room parameter from URL (?room=xxx)
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                state.familyCode = roomParam.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
            }

        async function saveState(broadcast = true) {
            state.updatedAt = Date.now();
            try {
                localStorage.setItem('kids_rewards_v4_state', JSON.stringify(state));
            } catch(e) {}

            if (!broadcast) return;

            // 1. Sync to Firebase Firestore
            if (db) {
                try {
                    const docRef = doc(db, "family_rooms", state.familyCode);
                    await setDoc(docRef, state, { merge: true });
                    updateCloudBadge(true, "☁️ 雲端實時同步中");
                    return;
                } catch(e) {
                    console.warn("Firestore save fallback", e);
                }
            }

            // 2. HTTP Relay Fallback
            try {
                const roomKey = 'kids_hk_room_' + state.familyCode;
                window.name = JSON.stringify(state);
                await fetch('https://kvdb.io/4yL9A5k6M9y3z1W8/' + roomKey, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state)
                });
                updateCloudBadge(true, "☁️ 雲端連線成功");
            } catch(err) {
                updateCloudBadge(false, "📱 本機儲存模式");
            }
        }

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (type === 'point') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
                        gain.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.08);
                        osc.stop(ctx.currentTime + idx * 0.08 + 0.3);
                    });
                } else if (type === 'redeem') {
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.4);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.12);
                        osc.stop(ctx.currentTime + idx * 0.12 + 0.4);
                    });
                }
            } catch (e) {}
        }

        // Subscribe Realtime Firestore Updates
        function subscribeToRoom() {
            if (!db) return;

            try {
                const docRef = doc(db, "family_rooms", state.familyCode);
                unsubscribeFirestore = onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const incomingData = snapshot.data();
                        if (incomingData && incomingData.profiles) {
                            if (!state.updatedAt || incomingData.updatedAt > state.updatedAt) {
                                state = { ...state, ...incomingData };
                                try { localStorage.setItem('kids_rewards_v4_state', JSON.stringify(state)); } catch(e){}
                                renderAll();
                            }
                        }
                    } else {
                        // First time room creation
                        saveState(true);
                    }
                    updateCloudBadge(true, "☁️ 雲端實時同步中");
                }, (error) => {
                    console.warn("Firestore subscription warn:", error);
                    setupPollingFallback();
                });
            } catch(e) {
                setupPollingFallback();
            }
        }

        // Fallback polling engine if websocket is temporarily blocked
        function setupPollingFallback() {
            if (pollTimer) clearInterval(pollTimer);
            updateCloudBadge(true, "☁️ 雲端同步模式");

            pollTimer = setInterval(async () => {
                try {
                    const roomKey = 'kids_hk_room_' + state.familyCode;
                    const res = await fetch('https://kvdb.io/4yL9A5k6M9y3z1W8/' + roomKey);
                    if (res.ok) {
                        const remoteState = await res.json();
                        if (remoteState && remoteState.updatedAt > state.updatedAt) {
                            state = { ...state, ...remoteState };
                            try { localStorage.setItem('kids_rewards_v4_state', JSON.stringify(state)); } catch(e){}
                            renderAll();
                        }
                    }
                } catch(e){}
            }, 3000);
        }

        // Initialize App
        function initApp() {
            loadFromLocalStorage();
            renderAll();

            document.getElementById('display-family-code').innerText = state.familyCode;

            // Initialize Firebase App
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                subscribeToRoom();
            } catch(err) {
                console.warn("Firebase Init Error", err);
                setupPollingFallback();
            }
        }

        // Global function exports for inline HTML onClick
        window.switchProfile = switchProfile;
        window.addPoints = addPoints;
        window.redeemReward = redeemReward;
        window.switchSection = switchSection;
        window.filterTasks = filterTasks;
        window.filterRewards = filterRewards;
        window.openAddTaskModal = openAddTaskModal;
        window.openAddRewardModal = openAddRewardModal;
        window.openEditNameModal = openEditNameModal;
        window.openFamilyCodeModal = openFamilyCodeModal;
        window.closeModal = closeModal;
        window.saveCustomTask = saveCustomTask;
        window.saveCustomReward = saveCustomReward;
        window.saveNameChange = saveNameChange;
        window.saveFamilyCode = saveFamilyCode;
        window.clearHistory = clearHistory;
        window.copyShareLink = copyShareLink;

        // Run App
        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
